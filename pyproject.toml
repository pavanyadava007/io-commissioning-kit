[project]
name = "io-commissioning-kit"
version = "0.1.0"
description = "I/O-list-driven commissioning toolkit for a simulated instrumentation rack"
authors = [{ name = "Pavan Yadava Annappa", email = "pavanyadava07@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["asyncua>=1.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
iokit = "iokit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iokit"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
